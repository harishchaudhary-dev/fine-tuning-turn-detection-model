-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#7d786f" text-anchor="middle">DistilBERT, 66.96M</text><text x="450" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#a8a39a" text-anchor="middle">each step adds language exposure, not architecture</text></svg>
