<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-label="Three referees, one question each: a frozen gold set of 60 human-labeled cards for generalization, 6 probe-found regressions for memory, and 96 held-out real-call turns for discovery"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111316"/><stop offset="0.55" stop-color="#0b0d10"/><stop offset="1" stop-color="#07080a"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.3" fill="#1c2024"/></pattern></defs><rect x="0" y="0" width="1040" height="300" rx="9" fill="url(#bg)"/><rect x="0" y="0" width="1040" height="300" rx="9" fill="url(#dots)"/><rect x="0" y="0" width="1040" height="300" rx="9" fill="none" stroke="#2a2e33"/><text x="520" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#f2efe9" font-weight="700" text-anchor="middle">Three referees, one question each</text><rect x="30" y="70" width="320" height="200" rx="10" fill="#111316" stroke="#2a2e33"/><rect x="30" y="70" width="6" height="200" rx="3" fill="#f5b342"/><text x="56" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#f5b342" font-weight="700">gold set</text><text x="56" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f2efe9">60 cards, frozen</text><text x="56" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a39a">Does it generalize to</text><text x="56" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a39a">the human's judgment?</text><rect x="56" y="222" width="198.4" height="32" rx="16" fill="#07080a" stroke="#2a2e33"/><text x="64" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7d786f">never trained on</text><rect x="360" y="70" width="320" height="200" rx="10" fill="#111316" stroke="#2a2e33"/><rect x="360" y="70" width="6" height="200" rx="3" fill="#f5b342"/><text x="386" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#f5b342" font-weight="700">regressions</text><text x="386" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f2efe9">6 probe-found misses</text><text x="386" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a39a">Does a fixed failure</text><text x="386" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a39a">stay fixed?</text><rect x="386" y="222" width="198.4" height="32" rx="16" fill="#07080a" stroke="#2a2e33"/><text x="394" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7d786f">overlap intended</text><rect x="690" y="70" width="320" height="200" rx="10" fill="#111316" stroke="#2a2e33"/><rect x="690" y="70" width="6" height="200" rx="3" fill="#7fa3b8"/><text x="716" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#7fa3b8" font-weight="700">real calls</text><text x="716" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f2efe9">96 held-out turns</text><text x="716" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a39a">What can synthetic data</text><text x="716" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a8a39a">not imagine?</text><rect x="716" y="222" width="187.0" height="32" rx="16" fill="#07080a" stroke="#2a2e33"/><text x="724" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7d786f">labeled by rule</text></svg>
