<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="fine-tuning-turn-detection-model: an end-of-turn detector for voice agents, read at threshold 0.42 on int8 CPU. On the frozen human gold set it scores 0.949 PR-AUC and speaks over none of the 27 wait cards. On 96 held-out real-call turns it scores 0.913 and speaks over 11 of the 47 wait turns, a rate of 0.234. End-to-end p95 is 33.1 ms at concurrency 8, the worst of four passes benched against that same file"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111316"/><stop offset="0.55" stop-color="#0b0d10"/><stop offset="1" stop-color="#07080a"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1.3" fill="#1c2024"/></pattern></defs><rect x="0" y="0" width="1200" height="360" rx="0" fill="url(#bg)"/><rect x="0" y="0" width="1200" height="360" rx="0" fill="url(#dots)"/><rect x="0" y="0" width="1200" height="3" rx="0" fill="#f5b342"/><text x="600" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#f5b342" font-weight="700" text-anchor="middle" letter-spacing="3">VOICE AI · END-OF-TURN DETECTION · FINE-TUNED AND FROM SCRATCH</text><defs><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f2efe9"/></linearGradient><linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5b342" stop-opacity="0"/><stop offset="0.5" stop-color="#f5b342" stop-opacity="0.95"/><stop offset="1" stop-color="#f5b342" stop-opacity="0"/></linearGradient></defs><text x="600" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" fill="url(#ttl)" font-weight="700" text-anchor="middle">Is the caller done talking?</text><text x="600" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" fill="#a8a39a" text-anchor="middle">One written policy, <tspan fill="#f5b342">three referees</tspan>, 33.1 ms p95 at concurrency 8</text><rect x="300" y="176" width="600" height="2" rx="0" fill="url(#rule)"/><text x="195" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" fill="#f5b342" font-weight="700" text-anchor="middle">0.949</text><text x="195" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#a8a39a" text-anchor="middle">gold PR-AUC</text><text x="195" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#7d786f" text-anchor="middle">0 of 27 false speaks</text><text x="465" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" fill="#f5b342" font-weight="700" text-anchor="middle">0.913</text><text x="465" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#a8a39a" text-anchor="middle">real calls PR-AUC</text><text x="465" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#7d786f" text-anchor="middle">held-out, 96 turns</text><text x="735" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" fill="#f5b342" font-weight="700" text-anchor="middle">0.234</text><text x="735" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#a8a39a" text-anchor="middle">real false speaks</text><text x="735" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#7d786f" text-anchor="middle">11 of 47 wait turns</text><text x="1005" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" fill="#f5b342" font-weight="700" text-anchor="middle">0.42</text><text x="1005" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#a8a39a" text-anchor="middle">threshold</text><text x="1005" y="